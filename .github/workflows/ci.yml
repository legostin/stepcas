name: ci

on:
    push:
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node: [20, 22, 24]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm ci
            # lint, formatting, the tests (architecture, i18n and the result contract included) and the golden record
            - run: npm run check
            # the benchmark corpus: no wrong answers, no errors, no timeouts
            - run: npm run bench -- --strict
