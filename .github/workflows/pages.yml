name: pages

# The demo (demo/) with the engine (src/) next to it, published to GitHub Pages on every push to main.
on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            # the examples on the page must all solve before it goes out
            - run: node --test test/demo.test.cjs
            # the page at the root, the engine in ./src: the demo imports ../src/ in the repo and ./src/ on the site
            - run: |
                  mkdir _site
                  cp demo/*.html demo/*.css demo/*.js _site/
                  cp -r src _site/src
                  sed -i "s#'\.\./src/#'./src/#g" _site/*.js
                  ! grep -n "\.\./src/" _site/*.js
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: _site

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
